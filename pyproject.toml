[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rfs"
dynamic = ["version"]
description = "Remote File System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.8",
    "fastapi>=0.115.8",
    "pyinstaller>=6.11.1",
    "python-multipart>=0.0.20",
    "requests>=2.32.3",
    "requests-toolbelt>=1.0.0",
    "rich>=13.9.4",
    "tqdm>=4.67.1",
    "uvicorn[standard]>=0.34.0",
]

[tool.hatch.version]
path = "rfs.py"

[tool.hatch.build.targets.wheel]
packages = ["rfs"]
